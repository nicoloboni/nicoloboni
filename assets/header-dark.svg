<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Nicolò Boni, developer at Zoonect">
<title>Nicolò Boni, developer at Zoonect</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.f{opacity:0;animation:fade .45s ease-out forwards}
.r{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.pulse{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(1.35);opacity:0}}
.crash rect{animation:crashbox 7s infinite}
.crash .led{animation:crashled 7s infinite}
@keyframes crashbox{0%,70%,86%,100%{stroke:#30363d;opacity:1}72%,78%{stroke:#f85149}80%,83%{opacity:.25}}
@keyframes crashled{0%,70%,86%,100%{fill:#7ee787}72%,83%{fill:#f85149}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .f,.r{opacity:1}
}
</style>
<rect x="1" y="1" width="838" height="298" rx="14" fill="#0d1117" stroke="#30363d"/>

<text class="mono r" style="animation-delay:0.10s" x="40" y="78" font-size="13" fill="#8b949e"><tspan fill="#5b85ec">iex&gt;</tspan> Nicolo.whoami()</text>
<text class="sans r" style="animation-delay:0.25s" x="38" y="136" font-size="48" font-weight="700" letter-spacing="-1" fill="#e6edf3">Nicolò Boni</text>
<text class="sans r" style="animation-delay:0.40s" x="40" y="172" font-size="17" fill="#8b949e">Developer at Zoonect, Montecatini Terme</text>
<text class="sans r" style="animation-delay:0.55s" x="40" y="200" font-size="17" fill="#8b949e">Elixir apps, Astro sites, brand visuals.</text>
<text class="mono r" style="animation-delay:0.70s" x="40" y="248" font-size="12" fill="#8b949e">strategy: <tspan fill="#dcf704">:one_for_one</tspan>  # let it crash</text>

